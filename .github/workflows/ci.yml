name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so new security advisories surface even without commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests run as the non-superuser "rfp" role so row-level security is really enforced.
      TEST_DATABASE_URL: postgresql+psycopg://rfp:rfp@localhost:5432/rfp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create the app role and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../deploy/postgres-init.sql
        env:
          PGPASSWORD: postgres
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Models match migrations
        run: alembic upgrade head && alembic check
        env:
          RFP_DATABASE_URL: postgresql+psycopg://rfp:rfp@localhost:5432/rfp
      - name: Eval harness smoke test (no-AI keyword baseline)
        run: python -m evals.extraction --runner keyword --out "$RUNNER_TEMP/eval"

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run build

  self-host:
    name: Self-hosted stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          ./deploy/setup.sh
      - name: Build and start
        run: docker compose up -d --build
      - name: Smoke test through the frontend
        run: |
          B=http://127.0.0.1:3000/api; O="Origin: http://localhost:3000"; J=$RUNNER_TEMP/cookies
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          curl -sf $B/health
          curl -sf -c $J -b $J -H "$O" -H 'Content-Type: application/json' -X POST $B/auth/signup \
            -d '{"org_name":"CI Co","name":"CI","email":"ci@example.com","password":"correct-horse-battery"}' >/dev/null
          echo "We completed the Riverside Elementary School, a K-12 project, in 2023." > $RUNNER_TEMP/doc.txt
          curl -sf -c $J -b $J -H "$O" -F file=@$RUNNER_TEMP/doc.txt -F doc_type=proposal $B/library/documents >/dev/null
          for i in $(seq 1 30); do
            st=$(curl -sf -b $J $B/library/documents | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["status"])')
            [ "$st" = ready ] && break; sleep 2
          done
          echo "document status: $st"; [ "$st" = ready ]
          curl -sf -b $J "$B/library/search?q=Riverside" | grep -q Riverside
          code=$(curl -s -o /dev/null -w '%{http_code}' -b $J -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' -X POST $B/bids -d '{"title":"x"}')
          [ "$code" = 403 ]
          # Only the frontend is published; the database and API are not reachable from outside.
          ! curl -s --max-time 3 http://127.0.0.1:8000/health
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Python packages
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm packages
        working-directory: frontend
        run: npm audit --audit-level=moderate
