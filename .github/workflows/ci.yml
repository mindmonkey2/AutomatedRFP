name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so new security advisories surface even without commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests run as the non-superuser "rfp" role so row-level security is really enforced.
      TEST_DATABASE_URL: postgresql+psycopg://rfp:rfp@localhost:5432/rfp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create the app role and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../deploy/postgres-init.sql
        env:
          PGPASSWORD: postgres
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Models match migrations
        run: alembic upgrade head && alembic check
        env:
          RFP_DATABASE_URL: postgresql+psycopg://rfp:rfp@localhost:5432/rfp
      - name: Eval harness smoke test (no-AI keyword baseline)
        run: python -m evals.extraction --runner keyword --out "$RUNNER_TEMP/eval"

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Python packages
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm packages
        working-directory: frontend
        run: npm audit --audit-level=moderate
