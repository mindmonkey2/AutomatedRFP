# Local Postgres for development: `docker compose up -d`
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres   # superuser, for admin only (dev); the app uses the "rfp" role
    ports:
      - "127.0.0.1:5432:5432"   # this machine only; never expose the superuser to the network
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
